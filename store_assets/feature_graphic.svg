<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070F1F"/>
      <stop offset="100%" stop-color="#0D1F6B"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tileShadow">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="circleShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow on right side -->
  <radialGradient id="rightGlow" cx="70%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1A237E" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#070F1F" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="500" fill="url(#rightGlow)"/>

  <!-- Decorative rings -->
  <circle cx="736" cy="250" r="332" fill="none" stroke="#1A2E6C" stroke-width="1" opacity="0.38"/>
  <circle cx="736" cy="250" r="262" fill="none" stroke="#1A2E6C" stroke-width="1" opacity="0.38"/>
  <circle cx="736" cy="250" r="210" fill="none" stroke="#203D85" stroke-width="1" opacity="0.22"/>

  <!-- Timer circle background -->
  <circle cx="736" cy="250" r="188" fill="#080E1E" stroke="#162050" stroke-width="2" filter="url(#circleShadow)"/>

  <!-- Timer track (dim full ring) -->
  <circle cx="736" cy="250" r="165" fill="none" stroke="#162050" stroke-width="14"/>

  <!-- Timer arc: 270° clockwise from top, leaving gap at bottom-left -->
  <path d="M 736 85 A 165 165 0 1 1 571.1 250.1"
        fill="none" stroke="url(#arcGrad)" stroke-width="14"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Clock tick marks -->
  <line x1="736" y1="90"  x2="736" y2="108" stroke="#2A4080" stroke-width="3"/>
  <line x1="901" y1="250" x2="883" y2="250" stroke="#2A4080" stroke-width="3"/>
  <line x1="736" y1="410" x2="736" y2="392" stroke="#2A4080" stroke-width="3"/>
  <line x1="571" y1="250" x2="589" y2="250" stroke="#2A4080" stroke-width="3"/>

  <!-- Hour hand (→ 12 o'clock) -->
  <line x1="736" y1="250" x2="736" y2="152"
        stroke="white" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
  <!-- Minute hand (→ 3 o'clock) -->
  <line x1="736" y1="250" x2="834" y2="250"
        stroke="#FFB300" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>
  <!-- Center -->
  <circle cx="736" cy="250" r="11" fill="#FFB300" filter="url(#softGlow)"/>
  <circle cx="736" cy="250" r="5"  fill="white"/>

  <!-- Time display -->
  <text x="736" y="338"
        font-family="'Courier New', Courier, monospace"
        font-size="30" font-weight="bold" fill="#FFB300"
        text-anchor="middle" letter-spacing="3" filter="url(#softGlow)">05:00</text>

  <!-- Mode cards -->
  <g filter="url(#cardShadow)">
    <rect x="590" y="48" width="144" height="72" rx="8" fill="#11245C" stroke="#3457B2" stroke-width="1.5"/>
    <text x="662" y="79" font-family="'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">루미큐브</text>
    <text x="662" y="101" font-family="'Malgun Gothic', Arial, sans-serif" font-size="12" fill="#90CAF9" text-anchor="middle">턴·점수 관리</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="814" y="60" width="146" height="78" rx="8" fill="#0C3B53" stroke="#39A7C7" stroke-width="1.5"/>
    <text x="887" y="92" font-family="'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">보드게임</text>
    <text x="887" y="115" font-family="'Malgun Gothic', Arial, sans-serif" font-size="12" fill="#9BE7FF" text-anchor="middle">장기·바둑·체스</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="826" y="352" width="140" height="76" rx="8" fill="#3B214D" stroke="#B36BE8" stroke-width="1.5"/>
    <text x="896" y="384" font-family="'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">일반 타이머</text>
    <text x="896" y="407" font-family="'Malgun Gothic', Arial, sans-serif" font-size="12" fill="#E1BEE7" text-anchor="middle">스톱워치·뽀모도로</text>
  </g>

  <!-- Rummikub tiles -->

  <!-- Tile: Red 7 (top-left of clock) -->
  <g transform="rotate(-14, 572, 140)" filter="url(#tileShadow)">
    <rect x="537" y="96" width="70" height="88" rx="9" fill="white"/>
    <text x="547" y="118" font-family="Arial" font-size="12" font-weight="bold" fill="#C62828">7</text>
    <text x="572" y="160" font-family="Arial Black, Arial" font-size="44" font-weight="900"
          fill="#C62828" text-anchor="middle">7</text>
  </g>

  <!-- Tile: Blue 3 (top-right) -->
  <g transform="rotate(12, 930, 175)" filter="url(#tileShadow)">
    <rect x="895" y="131" width="70" height="88" rx="9" fill="white"/>
    <text x="905" y="153" font-family="Arial" font-size="12" font-weight="bold" fill="#1565C0">3</text>
    <text x="930" y="195" font-family="Arial Black, Arial" font-size="44" font-weight="900"
          fill="#1565C0" text-anchor="middle">3</text>
  </g>

  <!-- Two-player board game clock -->
  <g transform="rotate(10, 572, 358)" filter="url(#tileShadow)">
    <rect x="511" y="320" width="122" height="76" rx="10" fill="#102A35" stroke="#38C6A4" stroke-width="2"/>
    <line x1="572" y1="320" x2="572" y2="396" stroke="#38C6A4" stroke-width="1" opacity="0.45"/>
    <circle cx="543" cy="356" r="18" fill="#FFFFFF"/>
    <circle cx="602" cy="356" r="18" fill="#111111"/>
    <text x="543" y="385" font-family="'Malgun Gothic', Arial, sans-serif" font-size="10" fill="#9CF4DA" text-anchor="middle">P1</text>
    <text x="602" y="385" font-family="'Malgun Gothic', Arial, sans-serif" font-size="10" fill="#9CF4DA" text-anchor="middle">P2</text>
  </g>

  <!-- General timer mini ring -->
  <g filter="url(#tileShadow)">
    <circle cx="736" cy="431" r="38" fill="#17132A" stroke="#443178" stroke-width="2"/>
    <circle cx="736" cy="431" r="27" fill="none" stroke="#2D2454" stroke-width="6"/>
    <path d="M 736 404 A 27 27 0 1 1 709 431" fill="none" stroke="#B36BE8" stroke-width="6" stroke-linecap="round"/>
    <text x="736" y="437" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#E1BEE7" text-anchor="middle">25</text>
  </g>

  <!-- Left side: Text content -->

  <!-- App name -->
  <text x="48" y="200"
        font-family="Arial Black, 'Arial Bold', Impact, sans-serif"
        font-size="96" font-weight="900" fill="url(#titleGrad)" letter-spacing="-3">Rummi</text>
  <text x="48" y="304"
        font-family="Arial Black, 'Arial Bold', Impact, sans-serif"
        font-size="96" font-weight="900" fill="#FFB300" letter-spacing="-3"
        filter="url(#softGlow)">timer</text>

  <!-- Accent line under title -->
  <rect x="48" y="318" width="200" height="4" rx="2" fill="#FFB300" opacity="0.7"/>

  <!-- Korean subtitle -->
  <text x="52" y="358"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="22" fill="#90CAF9" letter-spacing="2">보드게임부터 일상까지</text>

  <!-- Feature chips -->
  <!-- Chip 1 -->
  <rect x="50" y="382" width="112" height="30" rx="15" fill="#1A2E6C" stroke="#2A4DAD" stroke-width="1"/>
  <text x="110" y="402"
        font-family="'Malgun Gothic', Arial, sans-serif"
        font-size="13" fill="#90CAF9" text-anchor="middle">루미큐브</text>

  <!-- Chip 2 -->
  <rect x="172" y="382" width="160" height="30" rx="15" fill="#123353" stroke="#39A7C7" stroke-width="1"/>
  <text x="252" y="402"
        font-family="'Malgun Gothic', Arial, sans-serif"
        font-size="13" fill="#9BE7FF" text-anchor="middle">보드게임 타이머</text>

  <!-- Chip 3 -->
  <rect x="342" y="382" width="136" height="30" rx="15" fill="#3B214D" stroke="#B36BE8" stroke-width="1"/>
  <text x="410" y="402"
        font-family="'Malgun Gothic', Arial, sans-serif"
        font-size="13" fill="#E1BEE7" text-anchor="middle">일반 타이머</text>

  <!-- Tagline -->
  <text x="52" y="458"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" fill="#7B9FD4" font-style="italic">Every timer for your table.</text>

  <!-- Bottom brand accent dots -->
  <circle cx="52"  cy="478" r="3" fill="#FFB300"/>
  <circle cx="64"  cy="478" r="3" fill="#FFB300" opacity="0.6"/>
  <circle cx="76"  cy="478" r="3" fill="#FFB300" opacity="0.3"/>
</svg>

