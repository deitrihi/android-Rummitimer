<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2a"/>
      <stop offset="100%" style="stop-color:#0d0d18"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c5ceff"/>
      <stop offset="60%" style="stop-color:#b0baff"/>
      <stop offset="100%" style="stop-color:#9aaaf5"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" style="stop-color:#00000000"/>
      <stop offset="100%" style="stop-color:#00000066"/>
    </radialGradient>

    <!-- Tile base: creamy beige -->
    <linearGradient id="tileBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2e9d2"/>
      <stop offset="50%" style="stop-color:#e8ddc0"/>
      <stop offset="100%" style="stop-color:#d4c9a8"/>
    </linearGradient>
    <linearGradient id="tileHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff55"/>
      <stop offset="35%" style="stop-color:#ffffff10"/>
      <stop offset="100%" style="stop-color:#00000025"/>
    </linearGradient>
    <radialGradient id="concave" cx="50%" cy="38%" r="65%">
      <stop offset="0%" style="stop-color:#00000028"/>
      <stop offset="100%" style="stop-color:#00000000"/>
    </radialGradient>

    <filter id="tileShadow">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000aa"/>
    </filter>
    <filter id="ringShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#b0baff44"/>
    </filter>

    <!-- Circular clip for icon safe area (simulates rounded square mask) -->
    <clipPath id="safeArea">
      <rect width="512" height="512" rx="90" ry="90"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="90" ry="90" fill="url(#vignette)"/>

  <!-- Timer ring - centered, moved up slightly -->
  <circle cx="256" cy="210" r="140" fill="none" stroke="#b0baff18" stroke-width="28" filter="url(#ringShadow)"/>
  <circle cx="256" cy="210" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="22"/>
  <circle cx="256" cy="210" r="118" fill="#0d0d18"/>

  <!-- Timer text -->
  <text x="256" y="228"
    font-family="'Courier New', monospace"
    font-size="56"
    font-weight="700"
    text-anchor="middle"
    fill="#b0baff"
    letter-spacing="3">01:00</text>

  <!-- ===== TILES - bigger, centered, overlap ring bottom ===== -->
  <!-- Tile width: 96, height: 122 -->
  <!-- Fan centered around x=256, bottom around y=480 -->

  <!-- TILE 1: Red "7" - far left -->
  <g filter="url(#tileShadow)" transform="rotate(-20 140 460)">
    <rect x="92" y="340" width="96" height="122" rx="11" fill="#c0aa80"/>
    <rect x="88" y="336" width="96" height="122" rx="11" fill="url(#tileBase)"/>
    <rect x="88" y="336" width="96" height="122" rx="11" fill="url(#tileHighlight)"/>
    <rect x="97" y="346" width="78" height="100" rx="8" fill="#ddd0aa"/>
    <rect x="97" y="346" width="78" height="100" rx="8" fill="url(#concave)"/>
    <text x="136" y="460" font-family="Arial, sans-serif" font-size="6.5" text-anchor="middle" fill="#a89060" opacity="0.75">Rummikub</text>
    <text x="136" y="422" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="#cc2200">7</text>
  </g>

  <!-- TILE 2: Black "13" - left center -->
  <g filter="url(#tileShadow)" transform="rotate(-7 210 468)">
    <rect x="166" y="348" width="96" height="122" rx="11" fill="#c0aa80"/>
    <rect x="162" y="344" width="96" height="122" rx="11" fill="url(#tileBase)"/>
    <rect x="162" y="344" width="96" height="122" rx="11" fill="url(#tileHighlight)"/>
    <rect x="171" y="354" width="78" height="100" rx="8" fill="#ddd0aa"/>
    <rect x="171" y="354" width="78" height="100" rx="8" fill="url(#concave)"/>
    <text x="210" y="468" font-family="Arial, sans-serif" font-size="6.5" text-anchor="middle" fill="#a89060" opacity="0.75">Rummikub</text>
    <text x="210" y="430" font-family="Arial Black, sans-serif" font-size="50" font-weight="900" text-anchor="middle" fill="#1a1a1a">13</text>
  </g>

  <!-- TILE 3: Orange "9" - center (tallest, straight up) -->
  <g filter="url(#tileShadow)" transform="rotate(1 256 472)">
    <rect x="212" y="350" width="96" height="122" rx="11" fill="#c0aa80"/>
    <rect x="208" y="346" width="96" height="122" rx="11" fill="url(#tileBase)"/>
    <rect x="208" y="346" width="96" height="122" rx="11" fill="url(#tileHighlight)"/>
    <rect x="217" y="356" width="78" height="100" rx="8" fill="#ddd0aa"/>
    <rect x="217" y="356" width="78" height="100" rx="8" fill="url(#concave)"/>
    <text x="256" y="470" font-family="Arial, sans-serif" font-size="6.5" text-anchor="middle" fill="#a89060" opacity="0.75">Rummikub</text>
    <text x="256" y="432" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="#cc6600">9</text>
  </g>

  <!-- TILE 4: Blue "3" - right center -->
  <g filter="url(#tileShadow)" transform="rotate(13 304 466)">
    <rect x="260" y="346" width="96" height="122" rx="11" fill="#c0aa80"/>
    <rect x="256" y="342" width="96" height="122" rx="11" fill="url(#tileBase)"/>
    <rect x="256" y="342" width="96" height="122" rx="11" fill="url(#tileHighlight)"/>
    <rect x="265" y="352" width="78" height="100" rx="8" fill="#ddd0aa"/>
    <rect x="265" y="352" width="78" height="100" rx="8" fill="url(#concave)"/>
    <text x="304" y="466" font-family="Arial, sans-serif" font-size="6.5" text-anchor="middle" fill="#a89060" opacity="0.75">Rummikub</text>
    <text x="304" y="428" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="#1144bb">3</text>
  </g>

  <!-- TILE 5: Red "11" - far right -->
  <g filter="url(#tileShadow)" transform="rotate(24 374 458)">
    <rect x="330" y="338" width="96" height="122" rx="11" fill="#c0aa80"/>
    <rect x="326" y="334" width="96" height="122" rx="11" fill="url(#tileBase)"/>
    <rect x="326" y="334" width="96" height="122" rx="11" fill="url(#tileHighlight)"/>
    <rect x="335" y="344" width="78" height="100" rx="8" fill="#ddd0aa"/>
    <rect x="335" y="344" width="78" height="100" rx="8" fill="url(#concave)"/>
    <text x="374" y="458" font-family="Arial, sans-serif" font-size="6.5" text-anchor="middle" fill="#a89060" opacity="0.75">Rummikub</text>
    <text x="374" y="418" font-family="Arial Black, sans-serif" font-size="50" font-weight="900" text-anchor="middle" fill="#cc2200">11</text>
  </g>

</svg>
