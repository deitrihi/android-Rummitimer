<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>풍경 알림음 미리 듣기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #ddd;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 32px 24px;
    }
    h1 { font-size: 22px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
    .sub { font-size: 13px; color: #666; margin-top: 6px; text-align: center; line-height: 1.6; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }
    .card {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .card-info { flex: 1; }
    .card-name { font-size: 15px; font-weight: 600; color: #f0f0f0; }
    .card-desc { font-size: 12px; color: #666; margin-top: 5px; line-height: 1.5; }
    button.play {
      background: #1e4d70;
      border: none;
      border-radius: 10px;
      color: #a8d4f0;
      font-size: 13px;
      padding: 11px 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    button.play:hover { background: #163d5a; }
    button.play:active { transform: scale(0.97); }
    .slider-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row label { font-size: 12px; color: #666; width: 72px; flex-shrink: 0; }
    .slider-row input[type=range] { flex: 1; accent-color: #2a6a9a; }
    .slider-row span { font-size: 12px; color: #888; width: 44px; text-align: right; flex-shrink: 0; }
    .note { font-size: 11px; color: #333; }
  </style>
</head>
<body>

  <div style="text-align:center">
    <h1>풍경 (風磬)</h1>
    <p class="sub">맑고 은은한 합성음 — 조화 배음 + 피치 글라이드 + 공간 리버브</p>
  </div>

  <div class="slider-section">
    <div class="slider-row">
      <label>음 높이</label>
      <input type="range" id="freqSlider" min="380" max="900" value="660"
             oninput="document.getElementById('freqVal').textContent = this.value + ' Hz'">
      <span id="freqVal">660 Hz</span>
    </div>
    <div class="slider-row">
      <label>여운 길이</label>
      <input type="range" id="decaySlider" min="1" max="6" step="0.5" value="3.5"
             oninput="document.getElementById('decayVal').textContent = parseFloat(this.value).toFixed(1) + ' s'">
      <span id="decayVal">3.5 s</span>
    </div>
    <div class="slider-row">
      <label>공간감</label>
      <input type="range" id="reverbSlider" min="0" max="1" step="0.05" value="0.35"
             oninput="document.getElementById('reverbVal').textContent = Math.round(this.value * 100) + '%'">
      <span id="reverbVal">35%</span>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-info">
        <div class="card-name">단타</div>
        <div class="card-desc">한 번. 짧은 알림·세트 전환에 적합.</div>
      </div>
      <button class="play" onclick="playFunggyeong(1)">▶ 듣기</button>
    </div>
    <div class="card">
      <div class="card-info">
        <div class="card-name">이타</div>
        <div class="card-desc">두 번. 중간 체크포인트 알림에 적합.</div>
      </div>
      <button class="play" onclick="playFunggyeong(2)">▶ 듣기</button>
    </div>
    <div class="card">
      <div class="card-info">
        <div class="card-name">삼타 (바람)</div>
        <div class="card-desc">세 번, 불규칙 간격. 세션 종료처럼 의미 있는 이벤트에 적합.</div>
      </div>
      <button class="play" onclick="playFunggyeong(3)">▶ 듣기</button>
    </div>
  </div>

  <p class="note">sound_preview.html — 미리 듣기 전용, 빌드에 포함되지 않음</p>

  <script>
    // 합성곱 리버브 임펄스 생성 (짧고 맑은 돌/나무 공간감)
    function buildReverb(ctx) {
      const duration = 1.8;
      const len = Math.floor(ctx.sampleRate * duration);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          // 초반은 조금 더 밝게, 후반으로 갈수록 빠르게 감쇠
          const t = i / len;
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.8) * (1 + t * 0.3);
        }
      }
      const conv = ctx.createConvolver();
      conv.buffer = buf;
      return conv;
    }

    function strike(ctx, reverb, reverbGain, baseFreq, decaySec, startTime) {
      const dry = ctx.createGain();
      dry.gain.value = 1.0;
      dry.connect(ctx.destination);

      const wet = ctx.createGain();
      wet.gain.value = reverbGain;
      wet.connect(reverb);

      // 조화 배음 위주 — 비조화 성분 최소화 → 맑고 투명한 음색
      // 기음이 지배적, 2차 배음은 아주 낮게, 서브톤 제거
      const partials = [
        { ratio: 1.000, amp: 0.42, decay: decaySec },
        { ratio: 2.000, amp: 0.06, decay: decaySec * 0.30 },
        { ratio: 3.000, amp: 0.02, decay: decaySec * 0.12 },
      ];

      partials.forEach(({ ratio, amp, decay }) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';

        // 피치 글라이드: 타격 순간 0.8% 높게 시작 → 자연스럽게 안착
        // 실제 금속 타악기에서 나타나는 특성 — 맑은 울림의 핵심
        const targetFreq = baseFreq * ratio;
        osc.frequency.setValueAtTime(targetFreq * 1.008, startTime);
        osc.frequency.exponentialRampToValueAtTime(targetFreq, startTime + 0.08);

        osc.connect(g);
        g.connect(dry);
        g.connect(wet);

        const attack = 0.005;
        g.gain.setValueAtTime(0, startTime);
        g.gain.linearRampToValueAtTime(amp, startTime + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, startTime + attack + decay);

        osc.start(startTime);
        osc.stop(startTime + attack + decay + 0.1);
      });

      // 타격음: 아주 짧은 고주파 노이즈 (4 kHz 이상만 통과)
      const noiseLen = Math.floor(ctx.sampleRate * 0.012);
      const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < noiseLen; i++) nd[i] = Math.random() * 2 - 1;

      const noiseNode = ctx.createBufferSource();
      noiseNode.buffer = noiseBuf;

      const hpf = ctx.createBiquadFilter();
      hpf.type = 'highpass';
      hpf.frequency.value = 4200;

      const ng = ctx.createGain();
      noiseNode.connect(hpf);
      hpf.connect(ng);
      ng.connect(dry);

      ng.gain.setValueAtTime(0.13, startTime);
      ng.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.012);

      noiseNode.start(startTime);
      noiseNode.stop(startTime + 0.018);
    }

    function playFunggyeong(count) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const baseFreq = parseFloat(document.getElementById('freqSlider').value);
      const decay    = parseFloat(document.getElementById('decaySlider').value);
      const reverbMix = parseFloat(document.getElementById('reverbSlider').value);

      const reverb = buildReverb(audioCtx);
      reverb.connect(audioCtx.destination);

      const offsets =
        count === 1 ? [0] :
        count === 2 ? [0, decay * 0.48] :
                      [0, decay * 0.42, decay * 0.42 + decay * 0.50];

      offsets.forEach(offset => {
        strike(audioCtx, reverb, reverbMix, baseFreq, decay, audioCtx.currentTime + 0.05 + offset);
      });
    }
  </script>
</body>
</html>
