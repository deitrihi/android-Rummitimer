<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700" width="390" height="700">
  <defs><style>text{font-family:'Segoe UI',Arial,sans-serif;}</style></defs>

  <!-- Background -->
  <rect width="390" height="700" fill="#F5F5F5"/>

  <!-- Top App Bar -->
  <rect width="390" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="390" y2="64" stroke="#E0E0E0" stroke-width="1"/>
  <text x="195" y="41" font-size="20" font-weight="bold" fill="#1A1A1A" text-anchor="middle">점수 입력</text>

  <!-- Subtitle -->
  <text x="195" y="94" font-size="13" fill="#9CA3AF" text-anchor="middle">각 플레이어의 남은 타일 점수를 입력하세요</text>
  <text x="195" y="112" font-size="12" fill="#BDBDBD" text-anchor="middle">* 입력하지 않아도 완료할 수 있습니다</text>

  <!-- P1 row -->
  <rect x="16" y="128" width="358" height="72" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="44" y="173" font-size="32" fill="#1A1A1A">🍎</text>
  <text x="90" y="162" font-size="15" font-weight="600" fill="#1A1A1A">P1</text>
  <text x="90" y="180" font-size="12" fill="#9CA3AF">플레이어 1</text>
  <rect x="240" y="142" width="118" height="44" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="299" y="168" font-size="22" font-weight="bold" fill="#6B7280" text-anchor="middle" font-family="'Courier New',monospace">25</text>
  <text x="348" y="168" font-size="12" fill="#9CA3AF">점</text>

  <!-- P2 row -->
  <rect x="16" y="212" width="358" height="72" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="44" y="257" font-size="32" fill="#1A1A1A">🍌</text>
  <text x="90" y="246" font-size="15" font-weight="600" fill="#1A1A1A">P2</text>
  <text x="90" y="264" font-size="12" fill="#9CA3AF">플레이어 2</text>
  <rect x="240" y="226" width="118" height="44" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="299" y="252" font-size="22" font-weight="bold" fill="#6B7280" text-anchor="middle" font-family="'Courier New',monospace">65</text>
  <text x="348" y="252" font-size="12" fill="#9CA3AF">점</text>

  <!-- P3 row -->
  <rect x="16" y="296" width="358" height="72" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="44" y="341" font-size="32" fill="#1A1A1A">🍇</text>
  <text x="90" y="330" font-size="15" font-weight="600" fill="#1A1A1A">P3</text>
  <text x="90" y="348" font-size="12" fill="#9CA3AF">플레이어 3</text>
  <rect x="240" y="310" width="118" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="299" y="336" font-size="22" font-weight="bold" fill="#2563EB" text-anchor="middle" font-family="'Courier New',monospace">42</text>
  <text x="348" y="336" font-size="12" fill="#2563EB">점</text>
  <!-- Cursor blink indicator -->
  <rect x="327" y="318" width="2" height="28" rx="1" fill="#2563EB" opacity="0.8"/>

  <!-- P4 row -->
  <rect x="16" y="380" width="358" height="72" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="44" y="425" font-size="32" fill="#1A1A1A">🍓</text>
  <text x="90" y="414" font-size="15" font-weight="600" fill="#1A1A1A">P4</text>
  <text x="90" y="432" font-size="12" fill="#9CA3AF">플레이어 4</text>
  <rect x="240" y="394" width="118" height="44" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="299" y="420" font-size="22" font-weight="bold" fill="#6B7280" text-anchor="middle" font-family="'Courier New',monospace">89</text>
  <text x="348" y="420" font-size="12" fill="#9CA3AF">점</text>

  <!-- Numpad hint -->
  <rect x="16" y="468" width="358" height="120" rx="12" fill="#F3F4F6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="195" y="494" font-size="12" fill="#9CA3AF" text-anchor="middle">숫자 키패드</text>
  <!-- Simplified numpad -->
  <text x="100" y="526" font-size="20" fill="#6B7280" text-anchor="middle">7</text>
  <text x="160" y="526" font-size="20" fill="#6B7280" text-anchor="middle">8</text>
  <text x="220" y="526" font-size="20" fill="#6B7280" text-anchor="middle">9</text>
  <text x="280" y="526" font-size="20" fill="#EF4444" text-anchor="middle">⌫</text>
  <text x="100" y="560" font-size="20" fill="#6B7280" text-anchor="middle">4</text>
  <text x="160" y="560" font-size="20" fill="#6B7280" text-anchor="middle">5</text>
  <text x="220" y="560" font-size="20" fill="#6B7280" text-anchor="middle">6</text>
  <text x="280" y="560" font-size="20" fill="#6B7280" text-anchor="middle">0</text>

  <!-- Complete button -->
  <rect x="20" y="606" width="350" height="52" rx="26" fill="#2563EB"/>
  <text x="195" y="637" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">완료</text>

  <!-- Label -->
  <text x="195" y="684" font-size="11" fill="#BDBDBD" text-anchor="middle">점수 입력 화면 (v2)</text>
</svg>
