<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700" width="390" height="700">
  <defs><style>text{font-family:'Segoe UI',Arial,sans-serif;}</style></defs>

  <!-- Background -->
  <rect width="390" height="700" fill="#F5F5F5"/>

  <!-- Top App Bar -->
  <rect width="390" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="390" y2="64" stroke="#E0E0E0" stroke-width="1"/>
  <text x="20" y="41" font-size="20" font-weight="bold" fill="#1A1A1A">Rummitimer</text>
  <rect x="340" y="22" width="24" height="3" rx="1.5" fill="#6B7280"/>
  <rect x="340" y="30" width="24" height="3" rx="1.5" fill="#6B7280"/>
  <rect x="340" y="38" width="24" height="3" rx="1.5" fill="#6B7280"/>

  <!-- OPPONENT ZONE (rotated 180° — opponent reads from top) -->
  <g transform="rotate(180 195 125)">
    <!-- Opponent indicators (drawn at bottom of zone, appear at top after rotation) -->
    <circle cx="155" cy="158" r="7" fill="#E0E0E0"/>
    <text x="155" y="176" font-size="11" fill="#BDBDBD" text-anchor="middle">P1</text>
    <circle cx="195" cy="158" r="9" fill="#2563EB"/>
    <text x="195" y="176" font-size="11" fill="#2563EB" font-weight="bold" text-anchor="middle">P2</text>
    <circle cx="235" cy="158" r="7" fill="#E0E0E0"/>
    <text x="235" y="176" font-size="11" fill="#BDBDBD" text-anchor="middle">P3</text>
    <!-- Opponent control buttons (drawn at top of zone, appear at bottom after rotation) -->
    <rect x="20" y="80" width="84" height="40" rx="20" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="62" y="104" font-size="13" fill="#6B7280" text-anchor="middle">End</text>
    <rect x="116" y="80" width="158" height="40" rx="20" fill="#2563EB"/>
    <text x="195" y="104" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⏸  Pause</text>
    <rect x="286" y="80" width="84" height="40" rx="20" fill="#DBEAFE"/>
    <text x="328" y="104" font-size="13" fill="#2563EB" text-anchor="middle">Next</text>
  </g>
  <!-- Opponent zone label -->
  <text x="195" y="74" font-size="10" fill="#D1D5DB" text-anchor="middle">↑ 상대방 방향 (180° 회전)</text>

  <!-- Dashed separator -->
  <line x1="40" y1="193" x2="350" y2="193" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- SPLIT TIMER CIRCLE -->
  <!-- BG ring -->
  <circle cx="195" cy="360" r="110" fill="none" stroke="#E0E0E0" stroke-width="16"/>
  <!-- Progress ring (75% remaining) -->
  <circle cx="195" cy="360" r="110" fill="none" stroke="#2563EB" stroke-width="16"
    stroke-dasharray="691.15" stroke-dashoffset="172.8"
    stroke-linecap="round" transform="rotate(-90 195 360)"/>

  <!-- Opponent time (rotated 180° inside circle — opponent reads this) -->
  <text x="195" y="296" font-size="40" font-weight="bold" fill="#2563EB"
    text-anchor="middle" font-family="'Courier New',monospace"
    transform="rotate(180 195 285)">00:45</text>

  <!-- Player label (center) -->
  <text x="195" y="368" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">P2의 턴</text>

  <!-- Current player time -->
  <text x="195" y="418" font-size="40" font-weight="bold" fill="#2563EB"
    text-anchor="middle" font-family="'Courier New',monospace">00:45</text>

  <!-- Dashed separator -->
  <line x1="40" y1="497" x2="350" y2="497" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="195" y="510" font-size="10" fill="#D1D5DB" text-anchor="middle">↓ 현재 플레이어 방향</text>

  <!-- CURRENT PLAYER ZONE -->
  <!-- Indicators -->
  <circle cx="155" cy="524" r="7" fill="#E0E0E0"/>
  <text x="155" y="542" font-size="11" fill="#BDBDBD" text-anchor="middle">P1</text>
  <circle cx="195" cy="524" r="9" fill="#2563EB"/>
  <text x="195" y="542" font-size="11" fill="#2563EB" font-weight="bold" text-anchor="middle">P2</text>
  <circle cx="235" cy="524" r="7" fill="#E0E0E0"/>
  <text x="235" y="542" font-size="11" fill="#BDBDBD" text-anchor="middle">P3</text>
  <!-- Buttons -->
  <rect x="20" y="554" width="84" height="40" rx="20" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.5"/>
  <text x="62" y="578" font-size="13" fill="#6B7280" text-anchor="middle">End</text>
  <rect x="116" y="554" width="158" height="40" rx="20" fill="#2563EB"/>
  <text x="195" y="578" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⏸  Pause</text>
  <rect x="286" y="554" width="84" height="40" rx="20" fill="#DBEAFE"/>
  <text x="328" y="578" font-size="13" fill="#2563EB" text-anchor="middle">Next</text>

  <!-- Label -->
  <text x="195" y="660" font-size="11" fill="#BDBDBD" text-anchor="middle">홈 화면 — 세로 / 게임 중 (SplitTimerCircle)</text>
</svg>
