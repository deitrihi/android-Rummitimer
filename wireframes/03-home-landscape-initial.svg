<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" width="700" height="390">
  <defs><style>text{font-family:'Segoe UI',Arial,sans-serif;}</style></defs>

  <!-- Background -->
  <rect width="700" height="390" fill="#F5F5F5"/>

  <!-- Top App Bar -->
  <rect width="700" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="700" y2="56" stroke="#E0E0E0" stroke-width="1"/>
  <text x="20" y="36" font-size="20" font-weight="bold" fill="#1A1A1A">Rummitimer</text>
  <rect x="650" y="18" width="24" height="3" rx="1.5" fill="#6B7280"/>
  <rect x="650" y="26" width="24" height="3" rx="1.5" fill="#6B7280"/>
  <rect x="650" y="34" width="24" height="3" rx="1.5" fill="#6B7280"/>

  <!-- LEFT PANEL: Settings -->
  <rect x="16" y="72" width="288" height="302" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Player count -->
  <text x="160" y="102" font-size="12" fill="#9CA3AF" text-anchor="middle">인원 수</text>
  <rect x="52" y="110" width="68" height="30" rx="15" fill="#F3F4F6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="86" y="129" font-size="13" fill="#9CA3AF" text-anchor="middle">2명</text>
  <rect x="132" y="110" width="68" height="30" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="166" y="129" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">3명 ✓</text>
  <rect x="212" y="110" width="68" height="30" rx="15" fill="#F3F4F6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="246" y="129" font-size="13" fill="#9CA3AF" text-anchor="middle">4명</text>

  <!-- Turn duration -->
  <text x="160" y="162" font-size="12" fill="#9CA3AF" text-anchor="middle">턴 시간</text>
  <rect x="36" y="170" width="60" height="30" rx="15" fill="#F3F4F6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="66" y="189" font-size="12" fill="#9CA3AF" text-anchor="middle">30초</text>
  <rect x="108" y="170" width="60" height="30" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="138" y="189" font-size="12" fill="#2563EB" font-weight="bold" text-anchor="middle">60초 ✓</text>
  <rect x="180" y="170" width="60" height="30" rx="15" fill="#F3F4F6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="210" y="189" font-size="12" fill="#9CA3AF" text-anchor="middle">90초</text>
  <rect x="252" y="170" width="44" height="30" rx="15" fill="#F3F4F6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="274" y="189" font-size="12" fill="#9CA3AF" text-anchor="middle">2분</text>

  <!-- Vertical divider -->
  <line x1="320" y1="72" x2="320" y2="374" stroke="#E0E0E0" stroke-width="1.5"/>

  <!-- RIGHT PANEL: Timer + Controls -->
  <!-- Player turn label -->
  <text x="510" y="110" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">P1의 턴</text>

  <!-- Timer circle BG -->
  <circle cx="510" cy="228" r="90" fill="none" stroke="#E0E0E0" stroke-width="14"/>
  <!-- Timer circle progress (100%) -->
  <circle cx="510" cy="228" r="90" fill="none" stroke="#2563EB" stroke-width="14"
    stroke-dasharray="565.49" stroke-dashoffset="0"
    stroke-linecap="round" transform="rotate(-90 510 228)"/>
  <text x="510" y="242" font-size="40" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-family="'Courier New',monospace">01:00</text>

  <!-- Control buttons -->
  <rect x="360" y="336" width="70" height="36" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.5"/>
  <text x="395" y="358" font-size="13" fill="#6B7280" text-anchor="middle">End</text>
  <rect x="442" y="336" width="136" height="36" rx="18" fill="#2563EB"/>
  <text x="510" y="358" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">▶  Start</text>
  <rect x="590" y="336" width="70" height="36" rx="18" fill="#DBEAFE"/>
  <text x="625" y="358" font-size="13" fill="#2563EB" text-anchor="middle">Next</text>

  <!-- Player indicators -->
  <circle cx="480" cy="308" r="8" fill="#2563EB"/>
  <text x="480" y="326" font-size="10" fill="#2563EB" font-weight="bold" text-anchor="middle">P1</text>
  <circle cx="510" cy="308" r="6" fill="#E0E0E0"/>
  <text x="510" y="326" font-size="10" fill="#BDBDBD" text-anchor="middle">P2</text>
  <circle cx="540" cy="308" r="6" fill="#E0E0E0"/>
  <text x="540" y="326" font-size="10" fill="#BDBDBD" text-anchor="middle">P3</text>

  <!-- Label -->
  <text x="350" y="382" font-size="11" fill="#BDBDBD" text-anchor="middle">홈 화면 — 가로 / 초기 상태</text>
</svg>
